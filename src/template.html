<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sebvu's Todo List</title>
  </head>
  <body>
    <aside id="sidebar" class="_text --context-rg">
      <div class="sidebar__header header">
        <svg
          class="header__icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
        >
          <path d="M13,3V9H21V3M13,21H21V11H13M3,21H11V15H3M3,13H11V3H3V13Z" />
        </svg>
        <h1 class="header__title _text--header-font _text--bold">Projects</h1>
      </div>

      <div class="sidebar__projects projects _text --context-xxxs">
        <ul class="projects__list">
          <!-- example item begin -->
          <li class="projects__item">
            <div class="projects__icon-wrapper">
              <svg
                class="projects__icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <path
                  d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3M7 7H9V9H7V7M7 11H9V13H7V11M7 15H9V17H7V15M17 17H11V15H17V17M17 13H11V11H17V13M17 9H11V7H17V9Z"
                />
              </svg>
            </div>
            <!-- 20 character limit -->
            <h2 class="projects__name">WWWWWWWWWWWWWWWWWWWW</h2>
          </li>
          <li class="projects__item">
            <div class="projects__icon-wrapper">
              <svg
                class="projects__icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <path
                  d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3M7 7H9V9H7V7M7 11H9V13H7V11M7 15H9V17H7V15M17 17H11V15H17V17M17 13H11V11H17V13M17 9H11V7H17V9Z"
                />
              </svg>
            </div>
            <h2 class="projects__name">House Cleaning</h2>
          </li>
          <li class="projects__item">
            <div class="projects__icon-wrapper">
              <svg
                class="projects__icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <path
                  d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3M7 7H9V9H7V7M7 11H9V13H7V11M7 15H9V17H7V15M17 17H11V15H17V17M17 13H11V11H17V13M17 9H11V7H17V9Z"
                />
              </svg>
            </div>
            <h2 class="projects__name">Marriage Stuff</h2>
          </li>
          <!-- example item end -->
        </ul>
        <hr class="projects__seperator" />
        <button class="projects__add-button">Add Project</button>
      </div>
    </aside>
    <div id="main-container">
      <header id="header" class="_text --context-sm">
        <div class="header__buttons buttons">
          <button class="buttons__sidebar-button sidebar-button">
            <svg
              class="sidebar-button__icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
            >
              <path
                d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm240-80h400v-480H400v480Zm-80 0v-480H160v480h160Zm-160 0v-480 480Zm160 0h80-80Zm0-480h80-80Z"
              />
            </svg>
          </button>
          <button class="buttons__theme-button theme-button">
            <svg
              class="theme-button__icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <path
                d="M7.5,2C5.71,3.15 4.5,5.18 4.5,7.5C4.5,9.82 5.71,11.85 7.53,13C4.46,13 2,10.54 2,7.5A5.5,5.5 0 0,1 7.5,2M19.07,3.5L20.5,4.93L4.93,20.5L3.5,19.07L19.07,3.5M12.89,5.93L11.41,5L9.97,6L10.39,4.3L9,3.24L10.75,3.12L11.33,1.47L12,3.1L13.73,3.13L12.38,4.26L12.89,5.93M9.59,9.54L8.43,8.81L7.31,9.59L7.65,8.27L6.56,7.44L7.92,7.35L8.37,6.06L8.88,7.33L10.24,7.36L9.19,8.23L9.59,9.54M19,13.5A5.5,5.5 0 0,1 13.5,19C12.28,19 11.15,18.6 10.24,17.93L17.93,10.24C18.6,11.15 19,12.28 19,13.5M14.6,20.08L17.37,18.93L17.13,22.28L14.6,20.08M18.93,17.38L20.08,14.61L22.28,17.15L18.93,17.38M20.08,12.42L18.94,9.64L22.28,9.88L20.08,12.42M9.63,18.93L12.4,20.08L9.87,22.27L9.63,18.93Z"
              />
            </svg>
          </button>
        </div>
        <div class="header__curr-project curr-project">
          <div class="curr-project__inner-wrap">
            <svg
              class="curr-project__icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <path
                d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3M7 7H9V9H7V7M7 11H9V13H7V11M7 15H9V17H7V15M17 17H11V15H17V17M17 13H11V11H17V13M17 9H11V7H17V9Z"
              />
            </svg>
            <h1 class="curr-project__name _text--header-font">
              House Cleaning
            </h1>
          </div>
        </div>
      </header>
      <main id="main" class="_text --context-sm">
        <section class="todo">
          <h1 class="todo__name | _text _text--header-font">Buy list</h1>
          <section class="item | todo__item | _text --context-xxs">
            <ul class="item__list">
              <li>
                <h2 class="item__name">Fabuloso</h2>
              </li>
              <li>
                <p class="item__due-date">
                  Due date: <time datetime="2018-07-07">July 7th</time>
                </p>
              </li>
              <li>
                <p class="item__description">I gotta buy some fabuloso</p>
              </li>
            </ul>
          </section>
        </section>
      </main>
    </div>
    <footer id="footer" class="_text --context-xxxs">
      <p class="footer__cite">
        Background images courtesy of
        <a
          class="footer__link"
          href="https://unsplash.com/@jplenio"
          target="_blank"
          rel="noreferrer"
          >Johannes Plenio</a
        >
      </p>

      <p class="footer__cite">
        Colorschemes fully sourced from
        <a
          class="footer__link"
          href="https://catppuccin.com/"
          target="_blank"
          rel="noreferrer"
          >Catppuccin Macchiato &amp; Latte</a
        >
      </p>
    </footer>
  </body>
</html>
